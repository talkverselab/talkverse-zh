name: Android Release APK

# master 푸시마다 서명된 release APK를 빌드해 GitHub Release로 게시.
# 폰에서 Releases 페이지의 최신 APK를 받아 설치하면 됨 (USB 불필요).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Compute version tag
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' \r')
          echo "tag=v${VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=chinese_universe-${VERSION}-b${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.ver.outputs.name }}"

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: ${{ steps.ver.outputs.name }}
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 中国어유니버스 ${{ steps.ver.outputs.tag }}
          body: |
            자동 빌드 — 커밋 `${{ github.sha }}`

            ${{ github.event.head_commit.message }}

            📱 아래 APK를 폰에서 받아 설치하세요.
          files: ${{ steps.ver.outputs.name }}
          make_latest: true
