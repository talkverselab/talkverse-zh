name: chinese_universe
description: "중국어유니버스 — 한국 화자 중국어 학습 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  package_info_plus: ^10.0.0
  cupertino_icons: ^1.0.8

  # Audio
  audioplayers: ^6.1.0

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  sqflite: ^2.4.0

  # Util
  csv: ^6.0.0
  flutter_svg: ^2.0.10+1
  flutter_tts: ^4.2.0

  # Drift (SQLite ORM)
  drift: ^2.20.3
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  speech_to_text: ^7.4.0
  lpinyin: ^2.0.3
  record: ^6.2.1
  pitch_detector_dart: ^0.0.7
  http: ^1.6.0
  flutter_web_auth_2: ^5.1.0
  flutter_secure_storage: ^11.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  in_app_purchase: ^3.3.1
  in_app_purchase_storekit: ^0.4.16
  url_launcher: ^6.3.3   # 이용약관·개인정보처리방침 링크(출시 점검 2026-11-09)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift codegen
  drift_dev: ^2.20.3
  build_runner: ^2.4.13

  # Launcher icons
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/characters/icon_full.png"
  adaptive_icon_background: "#DE2910"
  adaptive_icon_foreground: "assets/characters/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # 글꼴(2026-11-03 사용자 확정 「문체」 조합, 모두 OFL — assets/fonts/licenses). 앱이 쓰는 글자만 남긴 부분 글꼴.
  fonts:
    - family: Pretendard   # 한글 UI·독음·번역
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
    - family: NotoSansSC   # 중국어 본문(대사)
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: LXGWWenKai   # 큰 한자 자형(팝업·한자 배우기·패밀리 한자)
      fonts:
        - asset: assets/fonts/LXGWWenKaiGB-Medium.ttf
    - family: NotoSans     # 병음(성조 부호)
      fonts:
        - asset: assets/fonts/NotoSans.ttf

  assets:
    - assets/images/ipa/places_of_articulation.png   # 병음 발음 시트 조음 위치 그림(임시 — 출시 전 Grok 그림으로 교체)
    - assets/fonts/licenses/   # 글꼴 OFL 전문(프로필 · 정보 → 글꼴 라이선스)
    - assets/data/audio_manifest.json
    - assets/data/version.json   # DB 업데이트 번호(db) — 데이터 바꾸면 이 번호만 올린다
    - assets/data/dialogues/north/L1.json
    - assets/data/dialogues/north/L2.json
    - assets/data/dialogues/north/L3.json
    - assets/data/dialogues/north/_meta.json
    - assets/data/dialogues/north/L4.json
    - assets/data/dialogues/south/L1.json
    # 새 회화 R0~R4 (레벨/주제 폴더 — 새 폴더를 만들면 여기에도 한 줄)
    - assets/data/dialogues/R1/survival/
    - assets/data/dialogues/R1/friends/
    - assets/data/dialogues/R1/love/
    - assets/data/dialogues/R1/life/
    - assets/data/dialogues/R1/travel/
    - assets/data/dialogues/R1/culture/
    - assets/data/dialogues/R2/love/
    - assets/data/dialogues/R2/friends/
    - assets/data/dialogues/R2/life/
    - assets/data/dialogues/R2/travel/
    - assets/data/dialogues/R2/culture/
    - assets/data/dialogues/R3/life/
    - assets/data/dialogues/R3/love/
    - assets/data/dialogues/R4/life/
    - assets/data/dialogues/R4/love/
    - assets/data/hanzi/cliff/hanzi_cliff_zh.tsv   # 한자 절벽 2,000자(DB 시딩) — tools/hanzi_cliff_build.py
    - assets/data/hanzi/hanzi_cliff.json           # 「절벽 한자」 단원(R1~R5)
    - assets/data/freq/lang_zh_with_regions.csv
    - assets/data/freq/conv_words_zh.json   # 절벽 단어 「회화 단어 포함」 — tools/freq/conv_words.py
    - assets/data/freq/FINAL_wordset_for_conversation_app.tsv
    - assets/audio/hanzi/
    - assets/data/grammar/lesson1.json
    - assets/data/grammar/hanzi_info.json
    - assets/data/hanzi/hanzi_stages.json
    - assets/data/hanzi/hanzi_hsk1500.json
    - assets/data/hanzi/phonetic_ext.json
    - assets/data/hanzi/hanzi_ko.json
    - assets/data/vocab/travel_words.json
    - assets/data/vocab/travel_expressions.json
    - assets/data/vocab/hsk_words.json
    - assets/data/vocab/conv_extra.json
